name: CI - Build & Test

# 触发：所有 PR + main 分支 push
# 目的：仅做构建验证与单元测试，不部署
on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend Build
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: |
          npm ci --no-audit --ignore-scripts
          npx prisma generate
          npm run build
          echo "✅ Backend TypeScript compile passed"

  admin-build:
    name: Admin Build
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - working-directory: admin
        run: |
          npm ci --no-audit --ignore-scripts
          npm run build
          echo "✅ Admin build passed"

  mobile-build:
    name: Mobile Build (H5)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - working-directory: mobile
        run: |
          npm ci --no-audit --ignore-scripts
          npm run build:h5
          echo "✅ Mobile H5 build passed"
