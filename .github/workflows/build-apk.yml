name: Build Android APK

# 触发条件：
# 1. 手动触发（推荐，避免每次 push 都构建）
# 2. 推送 main 分支（自动构建，便于更新下载页的 APK）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  PROJECT_NAME: shequn
  # 原生 App 内 API 基准地址（绝对地址，供 Capacitor WebView 访问后端）
  # 部署到服务器的 H5 构建不使用该变量（保持相对路径，由 Caddy 代理）
  API_BASE_URL: https://www.jugekeji.com

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install mobile dependencies
        working-directory: mobile
        # 仓库未跟踪 package-lock.json，使用 npm install（与生产部署行为一致）
        run: npm install --no-audit --no-fund

      - name: Build web bundle (native API base)
        working-directory: mobile
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          npm run build

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        working-directory: mobile/android
        run: |
          APK_PATH=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK_PATH=${APK_PATH}" >> $GITHUB_ENV
          echo "APK found: ${APK_PATH}"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: community-card-app
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add CVM host fingerprint
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy APK to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # 将 APK 放到 deploy/app/（deploy.sh 会保留该目录，并在每次部署后恢复到 dist）
          # 下载页通过 /h5/app/shequn.apk 访问
          ssh -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST} \
            "mkdir -p /home/ubuntu/shequn/deploy/app"
          scp -o StrictHostKeyChecking=yes "${{ env.APK_PATH }}" \
            ${SSH_USER}@${SSH_HOST}:/home/ubuntu/shequn/deploy/app/shequn.apk
          echo "✅ APK 已部署到服务器 deploy/app/shequn.apk"