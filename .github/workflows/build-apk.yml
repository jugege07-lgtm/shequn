name: Build Android APK

# 触发条件：
# 1. 手动触发（可在 Actions 页面点击）
# 2. 推送 main 分支（自动构建，确保下载页的 APK 始终最新）
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  PROJECT_NAME: shequn
  # 原生 App 内 API 基准地址（绝对地址，供 Capacitor WebView 访问后端）
  # 部署到服务器的 H5 构建不使用该变量（保持相对路径，由 Caddy 代理）
  API_BASE_URL: https://www.jugekeji.com

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install mobile dependencies
        working-directory: mobile
        # 仓库未跟踪 package-lock.json，使用 npm install（与生产部署行为一致）
        run: npm install --no-audit --no-fund

      - name: Build web bundle (native API base)
        working-directory: mobile
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
          # 原生构建：Vite base 设为 '/'（而非 H5 的 /h5/），否则 Capacitor WebView 资源 404 白屏
          VITE_NATIVE_BUILD: 'true'
        run: |
          export PATH="/usr/local/bin:$PATH"
          npm run build

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        working-directory: mobile/android
        run: |
          # 使用绝对路径，后续 Upload artifact 与 scp 步骤在仓库根目录运行，相对路径会找不到文件
          APK_PATH=$(find "$(pwd)/app/build/outputs/apk" -name '*.apk' | head -1)
          echo "APK_PATH=${APK_PATH}" >> $GITHUB_ENV
          echo "APK found: ${APK_PATH}"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: community-card-app
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add CVM host fingerprint
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Generate version timestamp
        id: ts
        # 生成构建时间戳（例如 20260813-075123），用于带版本号的安装包命名与下载页展示
        run: echo "TS=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Deploy APK to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TS: ${{ steps.ts.outputs.TS }}
        run: |
          # 1) 清理目标目录中的所有旧 APK（确保服务器只保留最新安装包），再保存到 deploy/app/
          #    （deploy-prod 部署时保留该目录，并在 deploy.sh 中恢复）
          ssh -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST} \
            "mkdir -p /home/ubuntu/shequn/deploy/app && mkdir -p /home/ubuntu/shequn/mobile/dist/app && find /home/ubuntu/shequn/deploy/app /home/ubuntu/shequn/mobile/dist/app -maxdepth 1 -iname '*.apk' -delete 2>/dev/null; echo '清理完成'; ls -lah /home/ubuntu/shequn/deploy/app/ /home/ubuntu/shequn/mobile/dist/app/"
          # 2) 带时间戳的安装包：可据此确认是否最新（shequn_<时间戳>.apk）
          scp -o StrictHostKeyChecking=yes "${{ env.APK_PATH }}" \
            ${SSH_USER}@${SSH_HOST}:/home/ubuntu/shequn/deploy/app/shequn_${TS}.apk
          scp -o StrictHostKeyChecking=yes "${{ env.APK_PATH }}" \
            ${SSH_USER}@${SSH_HOST}:/home/ubuntu/shequn/mobile/dist/app/shequn_${TS}.apk
          # 3) 稳定最新链接（shequn.apk 始终指向最新，兼容旧的下载入口）
          scp -o StrictHostKeyChecking=yes "${{ env.APK_PATH }}" \
            ${SSH_USER}@${SSH_HOST}:/home/ubuntu/shequn/mobile/dist/app/shequn.apk
          # 4) 写入当前版本时间戳，供下载页读取并展示/下载对应版本
          echo -n "${TS}" | ssh -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST} \
            "cat > /home/ubuntu/shequn/mobile/dist/app/latest.txt"
          echo "✅ APK(${TS}) 已部署到 deploy/app/ 与 mobile/dist/app/"