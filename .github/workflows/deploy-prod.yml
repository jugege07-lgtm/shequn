name: Deploy to Tencent Cloud (Production)

# 触发条件：
# 1. 推送 main 分支或 v*.*.* tag → 自动部署到生产
# 2. 手动触发（workflow_dispatch） → 可选择跳过数据库同步
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: '跳过数据库同步（紧急回滚时使用）'
        type: boolean
        default: false

# 并发控制：同一分支最新一次运行会取消旧运行
concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  PROJECT_NAME: shequn
  DEPLOY_PATH: /home/ubuntu/shequn

jobs:
  # ============================================================
  # Job 1: 打包 + 上传 + 部署（在 GitHub Runner 上打包，通过 SCP 推送到服务器）
  # ============================================================
  deploy:
    name: Build & Deploy (pm2+Caddy)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add CVM host fingerprint
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Package source code
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # 打包源码（排除 node_modules、dist、.env 等）
          # seed-assets(演示图,约12MB)不打包：服务器 uploads 已有这些图且部署时会备份恢复，排除后可大幅减小包体积
          cd $GITHUB_WORKSPACE
          tar -czf /tmp/shequn-src.tar.gz \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='backend/uploads' \
            --exclude='deploy/logs' \
            --exclude='mobile/android' \
            --exclude='.git' \
            --exclude='backend/seed-assets' \
            .
          echo "打包完成: $(du -h /tmp/shequn-src.tar.gz | cut -f1)"
          echo "$GITHUB_SHA" > /tmp/deploy_sha.txt

      - name: Pre-deploy server stabilization
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # 部署前 SSH 检查服务器资源与进程状态，并临时停掉后端以停止崩溃循环、释放资源
          # （deploy.sh 部署末尾会 pm2 restart 以新代码重启后端，故此处 stop 安全）
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            ${SSH_USER}@${SSH_HOST} '
            echo "=== 内存 ==="; free -m | head -2
            echo "=== 磁盘 ==="; df -h /home | tail -1
            echo "=== 后端 PM2 状态(停之前) ==="
            pm2 jlist 2>/dev/null | node -e "let d=\"\";process.stdin.on(\"data\",c=>d+=c).on(\"end\",()=>{try{JSON.parse(d).forEach(p=>console.log(p.name,\"| status:\"+p.pm2_env.status,\"| restarts:\"+p.pm2_env.restart_time))}catch(e){console.log(\"parse fail\")}})" 2>/dev/null || pm2 status 2>/dev/null
            echo "=== 临时停止后端(停止崩溃循环) ==="
            pm2 stop shequn-backend 2>/dev/null || true
            sleep 2
            echo "=== 停止后内存 ==="; free -m | head -2
          '

      - name: Upload source to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # 将源码包和部署脚本上传到服务器 /tmp，并做 sha256 校验，损坏/不完整则重试
          # 服务器因后端崩溃循环而不稳定时，scp 可能返回成功但文件被截断，必须校验
          # 本机(GitHub Runner/美国)到腾讯云(中国)链路较慢，单次传 20MB 会卡死(300s 传不完)，
          # 但 SSH 控制通道正常 → 改为"分块上传"：把源码包切成小块逐个 scp(短连接)，服务器端拼接后再校验
          SCP_OPTS="-o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          LOCAL_SHA=$(sha256sum /tmp/shequn-src.tar.gz | awk '{print $1}')
          echo "本地 sha256: $LOCAL_SHA"

          # 文件名统一编码，避免通配符问题
          SRC_BASE="shequn_src.tar.gz"
          CHUNKS_DIR="/tmp/shequn-chunks"
          rm -rf "$CHUNKS_DIR" && mkdir -p "$CHUNKS_DIR"
          # 切成 1MB 一块（约 8 块，链路实测约 30-40KB/s，1MB 约 30-40s，留足余量）
          split -b 1M /tmp/shequn-src.tar.gz "${CHUNKS_DIR}/part_"
          CHUNK_COUNT=$(ls "${CHUNKS_DIR}"/part_* | wc -l | tr -d ' ')
          echo "已切分 ${CHUNK_COUNT} 块"
          ls -lh "${CHUNKS_DIR}"/part_* | awk '{print $NF, $5}'

          # 服务器端清空旧的分块目录
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 ${SSH_USER}@${SSH_HOST} \
            "rm -rf /tmp/shequn-chunks && mkdir -p /tmp/shequn-chunks && rm -f /tmp/${SRC_BASE}" 2>/dev/null || true

          # 逐块上传，每块独立重试（短连接，不易被限速卡死）
          upload_fail=0
          for f in "${CHUNKS_DIR}"/part_*; do
            base=$(basename "$f")
            ok=0
            for attempt in 1 2 3 4 5; do
              echo "上传 $base (第 $attempt 次)..."
              if timeout 180 scp $SCP_OPTS "$f" ${SSH_USER}@${SSH_HOST}:/tmp/shequn-chunks/$base 2>/dev/null; then
                # 校验当前块大小是否一致
                local_sz=$(stat -c%s "$f")
                remote_sz=$(ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 ${SSH_USER}@${SSH_HOST} "stat -c%s /tmp/shequn-chunks/$base" 2>/dev/null)
                if [ "$local_sz" = "$remote_sz" ]; then
                  echo "  $base 校验通过 ($local_sz bytes) ✓"
                  ok=1
                  break
                else
                  echo "  $base 大小不一致(本地:$local_sz 远端:${remote_sz:-空})，重试..."
                  sleep 2
                fi
              else
                echo "  $base 上传失败(超时/断连)，2s 后重试..."
                sleep 2
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "块 $base 多次上传失败"
              upload_fail=1
              break
            fi
          done
          if [ "$upload_fail" = "1" ]; then
            echo "分块上传失败"
            exit 1
          fi

          # 服务器端拼接所有分块
          echo "服务器端拼接分块..."
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 ${SSH_USER}@${SSH_HOST} \
            "cat /tmp/shequn-chunks/part_* > /tmp/${SRC_BASE} && ls -l /tmp/${SRC_BASE}"

          # 校验拼接后的 sha256
          REMOTE_SHA=$(ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 ${SSH_USER}@${SSH_HOST} "sha256sum /tmp/${SRC_BASE} | awk '{print \$1}'" 2>/dev/null)
          echo "远端 sha256: $REMOTE_SHA"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "分块拼接后 sha256 不匹配，上传失败"
            exit 1
          fi
          echo "源码包分块上传+拼接+校验通过 ✓"
          # 转为 deploy.sh 期望的路径
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 ${SSH_USER}@${SSH_HOST} \
            "mv /tmp/${SRC_BASE} /tmp/shequn-src.tar.gz && rm -rf /tmp/shequn-chunks"

          # 上传部署脚本（脚本较小，单独传）
          for attempt in 1 2 3; do
            echo "上传部署脚本 (第 $attempt 次)..."
            if timeout 120 scp $SCP_OPTS \
              deploy/scripts/deploy.sh \
              ${SSH_USER}@${SSH_HOST}:/tmp/deploy.sh; then
              echo "部署脚本上传成功 ✓"
              break
            else
              echo "scp 脚本失败，3s 后重试..."
              sleep 3
            fi
          done

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SKIP_MIGRATE: ${{ inputs.skip_migrate }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          # 诊断：输出 Caddy 配置与静态资源转发，定位 /api/uploads 502 问题
          ssh -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST} \
            "echo '=== /etc/caddy/Caddyfile ==='; sudo cat /etc/caddy/Caddyfile 2>/dev/null || cat /etc/caddy/Caddyfile 2>/dev/null || echo none; echo '=== caddy test ==='; curl -s -o /dev/null -w 'direct3000 /api/uploads/test_a1.jpg -> %{http_code}\n' http://127.0.0.1:3000/api/uploads/test_a1.jpg; curl -s -o /dev/null -w 'direct3000 /uploads/test_a1.jpg -> %{http_code}\n' http://127.0.0.1:3000/uploads/test_a1.jpg; ls /home/ubuntu/shequn/backend/uploads/ 2>/dev/null | head -5"
          ssh -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST} \
            "bash /tmp/deploy.sh \
              '${GITHUB_REF}' \
              '${GITHUB_SHA}' \
              'false' \
              '${SKIP_MIGRATE}'"

      - name: Diagnose backend stability (PM2/logs)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST} '
            echo "=== PM2 进程状态 ==="
            pm2 jlist 2>/dev/null | node -e "let d=\"\";process.stdin.on(\"data\",c=>d+=c).on(\"end\",()=>{try{const a=JSON.parse(d);a.forEach(p=>console.log(p.name,\"| status:\"+p.pm2_env.status,\"| restarts:\"+p.pm2_env.restart_time,\"| mem:\"+Math.round((p.monit?.memory||0)/1048576)+\"MB\",\"| cpu:\"+Math.round(p.monit?.cpu||0)+\"%\",\"| node:\"+(p.pm2_env.node_version||\"\")))}catch(e){console.log(\"parse fail:\",e.message)}})" 2>/dev/null || pm2 status 2>/dev/null
            echo "=== 系统内存 ==="
            free -m | head -2
            echo "=== 后端错误日志 tail(带堆栈,最后60行) ==="
            tail -60 ~/.pm2/logs/shequn-backend-error*.log 2>/dev/null | tail -60
          '

  # ============================================================
  # Job 2: 健康检查（最后执行）
  # ============================================================
  healthcheck:
    name: Post-deploy Health Check
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    needs: deploy
    if: success()

    steps:
      - name: Hit health endpoints
        env:
          API_BASE: ${{ secrets.API_PUBLIC_URL }}
        run: |
          echo "⏳ Waiting 10s for service warm-up..."
          sleep 10
          echo ""
          echo "=== Backend health ==="
          curl -fsS -o /dev/null -w "HTTP %{http_code} | %{time_total}s\n" \
            "${API_BASE}/public/big-screen" && echo "✅ Backend OK" || echo "❌ Backend NOT healthy"
          echo ""
          echo "=== Swagger docs ==="
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "${API_BASE}/docs" && echo "✅ Swagger OK" || echo "❌ Swagger NOT reachable"
          echo ""
          echo "=== Admin SPA ==="
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.ADMIN_PUBLIC_URL }}" && echo "✅ Admin OK" || echo "❌ Admin NOT reachable"
          echo ""
          echo "=== Mobile H5 ==="
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.MOBILE_PUBLIC_URL }}" && echo "✅ Mobile H5 OK" || echo "❌ Mobile NOT reachable"
          echo ""
          echo "🎉 Deploy finished."
