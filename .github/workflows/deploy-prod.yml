name: Deploy to Tencent Cloud (Production)

# 触发条件：
# 1. 推送 main 分支或 v*.*.* tag → 自动部署到生产
# 2. 手动触发（workflow_dispatch） → 可选择跳过数据库同步
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: '跳过数据库同步（紧急回滚时使用）'
        type: boolean
        default: false

# 并发控制：同一分支最新一次运行会取消旧运行
concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  PROJECT_NAME: shequn
  DEPLOY_PATH: /home/ubuntu/shequn

jobs:
  # ============================================================
  # Job 1: 打包 + 上传 + 部署（在 GitHub Runner 上打包，通过 SCP 推送到服务器）
  # ============================================================
  deploy:
    name: Build & Deploy (pm2+Caddy)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add CVM host fingerprint
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Package source code
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # 打包源码（排除 node_modules、dist、.env 等）
          cd $GITHUB_WORKSPACE
          tar -czf /tmp/shequn-src.tar.gz \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='backend/uploads' \
            --exclude='deploy/logs' \
            --exclude='mobile/android' \
            --exclude='.git' \
            .
          echo "打包完成: $(du -h /tmp/shequn-src.tar.gz | cut -f1)"
          echo "$GITHUB_SHA" > /tmp/deploy_sha.txt

      - name: Upload source to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # 将源码包和部署脚本上传到服务器 /tmp
          scp -o StrictHostKeyChecking=yes \
            /tmp/shequn-src.tar.gz \
            ${SSH_USER}@${SSH_HOST}:/tmp/shequn-src.tar.gz
          scp -o StrictHostKeyChecking=yes \
            deploy/scripts/deploy.sh \
            ${SSH_USER}@${SSH_HOST}:/tmp/deploy.sh
          echo "源码上传完成"

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SKIP_MIGRATE: ${{ inputs.skip_migrate }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          # 诊断：输出 Caddy 配置与静态资源转发，定位 /api/uploads 502 问题
          ssh -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST} \
            "echo '=== /etc/caddy/Caddyfile ==='; sudo cat /etc/caddy/Caddyfile 2>/dev/null || cat /etc/caddy/Caddyfile 2>/dev/null || echo none; echo '=== caddy test ==='; curl -s -o /dev/null -w 'direct3000 /api/uploads/test_a1.jpg -> %{http_code}\n' http://127.0.0.1:3000/api/uploads/test_a1.jpg; curl -s -o /dev/null -w 'direct3000 /uploads/test_a1.jpg -> %{http_code}\n' http://127.0.0.1:3000/uploads/test_a1.jpg; ls /home/ubuntu/shequn/backend/uploads/ 2>/dev/null | head -5"
          ssh -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST} \
            "bash /tmp/deploy.sh \
              '${GITHUB_REF}' \
              '${GITHUB_SHA}' \
              'false' \
              '${SKIP_MIGRATE}'"

      - name: Diagnose backend stability (PM2/logs)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST} '
            echo "=== PM2 进程状态 ==="
            pm2 jlist 2>/dev/null | node -e "let d=\"\";process.stdin.on(\"data\",c=>d+=c).on(\"end\",()=>{try{const a=JSON.parse(d);a.forEach(p=>console.log(p.name,\"| status:\"+p.pm2_env.status,\"| restarts:\"+p.pm2_env.restart_time,\"| mem:\"+Math.round((p.monit?.memory||0)/1048576)+\"MB\",\"| cpu:\"+Math.round(p.monit?.cpu||0)+\"%\"))}catch(e){console.log(\"parse fail:\",e.message)}})" 2>/dev/null || pm2 status 2>/dev/null
            echo "=== 系统内存 ==="
            free -m | head -2
            echo "=== 后端错误日志(最近) ==="
            pm2 logs shequn-backend --lines 300 --nostream 2>/dev/null | grep -iE "error|exception|crash|heap|unhandled|killed|fatal|EADDR|ECONNRESET|prisma|timeout|out of memory" | tail -30
            echo "=== pm2 error log tail ==="
            tail -40 ~/.pm2/logs/shequn-backend-error*.log 2>/dev/null | tail -30
          '

  # ============================================================
  # Job 2: 健康检查（最后执行）
  # ============================================================
  healthcheck:
    name: Post-deploy Health Check
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    needs: deploy
    if: success()

    steps:
      - name: Hit health endpoints
        env:
          API_BASE: ${{ secrets.API_PUBLIC_URL }}
        run: |
          echo "⏳ Waiting 10s for service warm-up..."
          sleep 10
          echo ""
          echo "=== Backend health ==="
          curl -fsS -o /dev/null -w "HTTP %{http_code} | %{time_total}s\n" \
            "${API_BASE}/public/big-screen" && echo "✅ Backend OK" || echo "❌ Backend NOT healthy"
          echo ""
          echo "=== Swagger docs ==="
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "${API_BASE}/docs" && echo "✅ Swagger OK" || echo "❌ Swagger NOT reachable"
          echo ""
          echo "=== Admin SPA ==="
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.ADMIN_PUBLIC_URL }}" && echo "✅ Admin OK" || echo "❌ Admin NOT reachable"
          echo ""
          echo "=== Mobile H5 ==="
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.MOBILE_PUBLIC_URL }}" && echo "✅ Mobile H5 OK" || echo "❌ Mobile NOT reachable"
          echo ""
          echo "🎉 Deploy finished."
