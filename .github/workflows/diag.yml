name: Diag - Inspect server Caddy config
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add host fingerprint
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Inspect
        env:
          H: ${{ secrets.SSH_HOST }}
          U: ${{ secrets.SSH_USER }}
        run: |
          echo "=== user/host ==="; echo "$U@$H"
          echo "=== caddy files ==="
          ssh -o StrictHostKeyChecking=yes "$U@$H" "ls -la /etc/caddy/ 2>/dev/null; echo '---'; sudo cat /etc/caddy/Caddyfile 2>/dev/null || cat /etc/caddy/Caddyfile 2>/dev/null || echo 'no Caddyfile at /etc/caddy'"
          echo "=== uploads dir ==="
          ssh -o StrictHostKeyChecking=yes "$U@$H" "ls /home/ubuntu/shequn/backend/uploads/ 2>/dev/null | head; echo '---find caddy---'; find / -maxdepth 4 -name 'Caddyfile*' 2>/dev/null | head"
          echo "=== test via localhost ==="
          ssh -o StrictHostKeyChecking=yes "$U@$H" "curl -s -o /dev/null -w 'direct /api/uploads/test_a1.jpg -> %{http_code}\n' http://127.0.0.1:3000/api/uploads/test_a1.jpg; curl -s -o /dev/null -w 'direct /uploads/test_a1.jpg -> %{http_code}\n' http://127.0.0.1:3000/uploads/test_a1.jpg"