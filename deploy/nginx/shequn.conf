# =============================================================================
#  shequn Nginx 站点配置
#  路径：/etc/nginx/sites-available/shequn
#  启用：ln -s .../sites-available/shequn .../sites-enabled/shequn
# =============================================================================

# ---- API 反向代理 ----
server {
    listen 443 ssl http2;
    server_name api.jugekeji.cn;

    ssl_certificate     /etc/letsencrypt/live/jugekeji.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jugekeji.cn/privkey.pem;

    client_max_body_size 20m;

    # 日志
    access_log /var/log/nginx/shequn-api.access.log;
    error_log  /var/log/nginx/shequn-api.error.log;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# ---- 主站：管理后台 + 移动端 H5 ----
server {
    listen 443 ssl http2;
    server_name jugekeji.cn www.jugekeji.cn;

    ssl_certificate     /etc/letsencrypt/live/jugekeji.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jugekeji.cn/privkey.pem;

    root  /var/www/shequn;
    index index.html;

    access_log /var/log/nginx/shequn-web.access.log;
    error_log  /var/log/nginx/shequn-web.error.log;

    # 管理后台 SPA
    location /admin {
        alias /var/www/shequn/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # 移动端 H5
    location /h5 {
        alias /var/www/shequn/h5;
        try_files $uri $uri/ /h5/index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        return 404;
    }
}

# ---- HTTP → HTTPS ----
server {
    listen 80;
    server_name jugekeji.cn www.jugekeji.cn api.jugekeji.cn;
    return 301 https://$host$request_uri;
}
